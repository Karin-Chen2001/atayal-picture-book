<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mnanak na qalang 泰雅族語繪本</title>
<style>
  :root{--warm:#ffb347;--deep:#3b1a0a;--cream:#fff3dc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#7a3a14,#2a1006 75%);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--cream)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:56px 170px 78px}
  #frame{position:relative;aspect-ratio:4/3;width:min(100%,calc((100vh - 134px)*4/3));border-radius:18px;border:6px solid var(--warm);box-shadow:0 12px 40px #000a,0 0 0 3px #7a3a14;overflow:hidden;background:#000}
  #pic{display:block;width:100%;height:100%;object-fit:cover;cursor:pointer}
  #sub{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;text-align:center;background:linear-gradient(transparent,#000d 55%);pointer-events:none}
  #sub:empty,#sub.empty{display:none}
  #ay{font-size:clamp(18px,3.4vw,36px);font-weight:800;color:#ffe08a;line-height:1.35;text-shadow:0 2px 6px #000}
  #zh{font-size:clamp(13px,2vw,22px);color:#fff;margin-top:4px;text-shadow:0 2px 6px #000}
  #pageno{position:fixed;left:14px;bottom:18px;background:var(--warm);color:var(--deep);font-weight:800;font-size:20px;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 #b86a0c;z-index:5}
  #stage{cursor:pointer}
  /* 翻頁效果：舊的一頁像書頁一樣繞左邊書脊翻開 */
  .flip{position:absolute;inset:0;pointer-events:none;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;z-index:3}
  .flip img{display:block;width:100%;height:100%;object-fit:cover}
  .flip::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0000 0%,#000a 100%)}
  .fnext{animation:fnext .7s cubic-bezier(.55,0,.35,1) forwards}
  .fnext::after{animation:shadeIn .7s ease-in forwards}
  .fprev{animation:fprev .7s cubic-bezier(.35,0,.55,1) forwards}
  .fprev::after{animation:shadeOut .7s ease-out forwards}
  @keyframes fnext{from{transform:perspective(1400px) rotateY(0)}to{transform:perspective(1400px) rotateY(95deg)}}
  @keyframes fprev{from{transform:perspective(1400px) rotateY(95deg)}to{transform:perspective(1400px) rotateY(0)}}
  @keyframes shadeIn{from{opacity:0}to{opacity:1}}
  @keyframes shadeOut{from{opacity:1}to{opacity:0}}
  #tapL,#tapR{position:fixed;top:50%;font-size:13px;opacity:.55;pointer-events:none}
  #pic.talk{animation:talk .9s ease-in-out infinite}
  @keyframes talk{50%{transform:scale(1.015) rotate(.4deg)}}
  .btn{position:fixed;border:0;background:none;padding:0;cursor:pointer;transition:transform .15s}
  .btn:active{transform:scale(.88)}
  .btn img{display:block;mix-blend-mode:screen}
  #prev{left:10px;top:50%}#next{right:10px;top:50%}
  #prev,#next{display:flex;flex-direction:row;align-items:center;gap:8px;margin-top:-30px}
  #next{flex-direction:row-reverse}  /* 下一頁：文字在左、箭頭在右 */
  #prev img,#next img{width:56px;height:auto;filter:drop-shadow(0 0 8px var(--warm))}
  .lbl{font-size:20px;font-weight:800;color:var(--deep);background:var(--warm);padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 #b86a0c;white-space:nowrap}
  .nudge{animation:nudge 1.2s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(6px)}}
  #prev.nudge{animation-name:nudgeL}@keyframes nudgeL{50%{transform:translateX(-6px)}}
  #read{left:50%;bottom:8px;transform:translateX(-50%)}
  #read img{height:66px;width:auto;border-radius:14px}
